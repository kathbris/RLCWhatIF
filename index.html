aria-live='polite'></div></div><details class='card'><summary>Formula reference</summary><div id='rlcRef'></div></details><script>(function(){var root=document.getElementById('rlcT');if(!root||root.dataset.init)return;root.dataset.init='1'; var $=function(s){return root.querySelector(s)};var pick=function(a){return a[Math.floor(Math.random()*a.length)]}; var RS=[10,15,22,33,47,56,68,82,100,150],RP=[22,47,68,100,150,220,330],RCS=[2,4,5,8,10,12,15,20,25,30],LS=[10,20,47,50,100,150,200,250,330,470],CS=[1,2.2,4.7,10,22,33,47,68,100,150,220],FS=[60,60,60,120,400,1000],VS=[24,120,120,208,240]; var mode='series';var XLs='X<sub>L</sub>',XCs='X<sub>C</sub>',RCs='R<sub>coil</sub>',ZCs='Z<sub>coil</sub>',ICs='I<sub>coil</sub>'; var VU={R:'Ω',Rc:'Ω',L:'H',C:'F',f:'Hz',V:'V'}; function vn(v,real){return {R:real?'external resistance (R)':'resistance (R)',Rc:'coil resistance ('+RCs+')',L:'inductance (L)',C:'capacitance (C)',f:'source frequency (f)',V:'source voltage (V)'}[v]} function fmt(x,u){if(!isFinite(x))return '—';if(Math.abs(x)<1e-9)x=0;if(u==='°')return x.toFixed(1)+'°';if(u==='')return x.toFixed(3);if(x===0)return '0 '+u;var a=Math.abs(x),pr=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']],p=pr[pr.length-1];for(var i=0;i<pr.length;i++){if(a>=pr[i][0]*0.9995){p=pr[i];break}}return parseFloat((x/p[0]).toPrecision(3))+' '+p[1]+u} function pct(x){return Math.round(x*100)+'%'} function rel(a,b){return (b-a)/Math.max(Math.abs(a),1e-12)} function dir(a,b){if(Math.abs(a)<1e-9&&Math.abs(b)<1e-9)return 'same';var d=rel(a,b);return Math.abs(d)<1e-6?'same':(d>0?'inc':'dec')} /* ---------- SERIES (pure or real coil) ---------- */ function sProps(real){var L=[['XL','inductive reactance ('+XLs+')','Ω',XLs+' = 2πfL'],['XC','capacitive reactance ('+XCs+')','Ω',XCs+' = 1 / (2πfC)']]; if(real)L.push(['ZC','coil impedance ('+ZCs+')','Ω',ZCs+' = √('+RCs+'² + '+XLs+'²)']); var RT=real?'(R + '+RCs+')':'R'; L.push(['Z','total impedance (Z)','Ω','Z = √('+RT+'² + ('+XLs+' − '+XCs+')²)'],['I','total current (I)','A','I = V / Z'],['VR','voltage across R (V<sub>R</sub>)','V','V<sub>R</sub> = I × R']); L.push(real?['VZ','voltage across the coil (V<sub>coil</sub>)','V','V<sub>coil</sub> = I × '+ZCs]:['VZ','voltage across L (V<sub>L</sub>)','V','V<sub>L</sub> = I × '+XLs]); L.push(['VC','voltage across C (V<sub>C</sub>)','V','V<sub>C</sub> = I × '+XCs],['th','phase angle (θ, size of angle)','°','θ = tan⁻¹(|'+XLs+' − '+XCs+'| / '+RT+')'],['PF','power factor (PF)','','PF = cos θ = '+RT+' / Z'],['P','true power (P)','W','P = I² × '+RT],['S','apparent power (S)','VA','S = V × I']);return L} function sCalc(c){var w=2*Math.PI*c.f,XL=w*c.L,XC=1/(w*c.C),RT=c.R+c.Rc,X=XL-XC,Z=Math.hypot(RT,X),I=c.V/Z,ZC=Math.hypot(c.Rc,XL);return {XL:XL,XC:XC,ZC:ZC,Z:Z,I:I,VR:I*c.R,VZ:I*ZC,VC:I*XC,th:Math.atan(Math.abs(X)/RT)*180/Math.PI,PF:RT/Z,P:I*I*RT,S:c.V*I}} function okR(x){return (x>=0.2&&x<=0.75)||(x>=1.33&&x<=5)} var TIP={f:`Raising f raises ${XLs} (2πfL) and lowers ${XCs} (1/2πfC); lowering f does the opposite.`,L:`L only affects ${XLs}. More L means more ${XLs}.`,C:`C only affects ${XCs}. More C means <i>less</i> ${XCs}.`,R:`R does not change ${XLs} or ${XCs}; it changes how resistive the circuit is.`,V:`Voltage does not change any resistance, reactance, impedance, θ or PF; currents, voltage drops and power follow V.`,Rc:`${RCs} does not change ${XLs} or ${XCs}. It raises ${ZCs} and adds to the circuit's total resistance.`}; function sNat(r){return r.XL>r.XC?`inductive (${XLs} &gt; ${XCs})`:`capacitive (${XCs} &gt; ${XLs})`} function genSeries(){var last;for(var i=0;i<3000;i++){var real=Math.random()<0.5,c={R:pick(RS),Rc:real?pick(RCS):0,L:pick(LS)*1e-3,C:pick(CS)*1e-6,f:pick(FS),V:pick(VS)};var vars=real?['R','Rc','L','C','f','V']:['R','L','C','f','V'];var v=pick(vars),up=Math.random()<0.5,c2=Object.assign({},c);c2[v]=c[v]*(up?pick([1.5,2]):pick([1/1.5,0.5]));var a=sCalc(c),b=sCalc(c2),r1=a.XL/a.XC,r2=b.XL/b.XC,props=sProps(real),p=pick(props),d=Math.abs(rel(a[p[0]],b[p[0]])); var note=real?`A real coil acts like ${RCs} in series with L, so ${ZCs} = √(${RCs}² + ${XLs}²) and the voltage measured across the coil is I × ${ZCs}. Total circuit resistance is R + ${RCs}; in series the current is common and the <b>larger</b> reactance dominates.`:`This is a pure (ideal) coil, so the coil is only ${XLs}. In series the current is common and the <b>larger</b> reactance dominates; Z = √(R² + (${XLs} − ${XCs})²).`; var tp=(real&&v==='R')?`The external R does not change ${XLs}, ${XCs} or ${ZCs}; it adds to the total resistance (R + ${RCs}).`:(real&&v==='L')?`L only affects ${XLs}, which also changes ${ZCs}. More L means more ${XLs}.`:TIP[v]; last={kind:'s',real:real,c:c,c2:c2,a:a,b:b,props:props,p:p,ans:dir(a[p[0]],b[p[0]]),  qtxt:`In this <b>series RLC circuit with a ${real?'real coil':'pure coil'}</b>, the <b>${vn(v,real)}</b> is <b>${up?'increased':'decreased'}</b> while everything else stays the same. What happens to the <b>${p[1]}</b>?`,  change:`${vn(v,real)} ${fmt(c[v],VU[v])} → ${fmt(c2[v],VU[v])}. The circuit is ${sNat(a)}, both before and after.`,  why:tp+' '+note,hint:`Before the change: ${XLs} = ${fmt(a.XL,'Ω')}, ${XCs} = ${fmt(a.XC,'Ω')}${real?`, ${ZCs} = ${fmt(a.ZC,'Ω')}`:''}, so the circuit is <b>${sNat(a)}</b>. ${tp}`}; if(okR(r1)&&okR(r2)&&((r1>1)===(r2>1))&&(d<1e-6||d>=0.03))return last}return last} /* ---------- PARALLEL (pure/real coil) ---------- */ function pCalc(c){var w=2*Math.PI*c.f,XL=w*c.L,XC=c.C>0?1/(w*c.C):Infinity,Zc2=c.Rc*c.Rc+XL*XL,Zc=Math.sqrt(Zc2),G=1/c.R+c.Rc/Zc2,B=w*c.C-XL/Zc2,Y=Math.hypot(G,B),V=c.V;return {XL:XL,XC:XC,ZC:Zc,IR:V/c.R,IL:V/Zc,IC:V*w*c.C,IT:V*Y,Z:1/Y,th:Math.atan(Math.abs(B)/G)*180/Math.PI,PF:G/Y,P:V*V*G,Q:V*V*Math.abs(B),S:V*V*Y,lag:B<0,Cv:c.C}} function pProps(real,pfc){var L=[];if(!pfc){L.push(['XL','inductive reactance ('+XLs+')','Ω',XLs+' = 2πfL'],['XC','capacitive reactance ('+XCs+')','Ω',XCs+' = 1 / (2πfC)'])} if(pfc==='t')L.push(['Cv','required capacitance (C)','F','C = Q<sub>C</sub> / (V² × 2πf)']); L.push(['IR','resistor current (I<sub>R</sub>)','A','I<sub>R</sub> = V / R']); L.push(real?['IL','coil current ('+ICs+')','A',ICs+' = V / '+ZCs+', where '+ZCs+' = √('+RCs+'² + '+XLs+'²)']:['IL','inductor current (I<sub>L</sub>)','A','I<sub>L</sub> = V / '+XLs]); L.push(['IC','capacitor current (I<sub>C</sub>)','A','I<sub>C</sub> = V / '+XCs],['IT','total (line) current (I<sub>T</sub>)','A','I<sub>T</sub> = √(I<sub>active</sub>² + I<sub>reactive</sub>²) = S / V'],['Z','total impedance (Z)','Ω','Z = V / I<sub>T</sub>'],['th','phase angle (θ, size of angle)','°','θ = tan⁻¹(Q / P)'],['PF','power factor (PF)','','PF = cos θ = P / S'],['P','true power (P)','W',real?'P = V²/R + '+ICs+'² × '+RCs:'P = V × I<sub>R</sub>'],['Q','reactive power from the supply (Q)','VAR','Q = |Q<sub>L</sub> − Q<sub>C</sub>|'],['S','apparent power (S)','VA','S = V × I<sub>T</sub> = √(P² + Q²)']);return L} function pNat(r){return r.lag?'inductive / lagging (I<sub>L</sub> reactive part &gt; I<sub>C</sub>)':'capacitive / leading (I<sub>C</sub> &gt; I<sub>L</sub> reactive part)'} var PNOTE=`In parallel the voltage is common, so the branch with the <b>smaller</b> reactance draws more reactive current and dominates.`; function genParA(){var last;for(var i=0;i<3000;i++){var real=Math.random()<0.5,c={R:pick(RP),Rc:real?pick(RCS):0,L:pick(LS)*1e-3,C:pick(CS)*1e-6,f:pick(FS),V:pick(VS)};var v=pick(real?['R','Rc','L','C','f','V']:['R','L','C','f','V']),up=Math.random()<0.5,c2=Object.assign({},c);c2[v]=c[v]*(up?pick([1.5,2]):pick([1/1.5,0.5]));var a=pCalc(c),b=pCalc(c2),props=pProps(real,false),p=pick(props),d=Math.abs(rel(a[p[0]],b[p[0]])); var tp=v==='Rc'?`${RCs} raises ${ZCs}, so the coil draws less current, and that current is more in phase with V (more resistive, less reactive).`:TIP[v];var cn=real?` A real coil branch draws ${ICs} = V / ${ZCs}; part of that current is resistive (adds to P) and part is reactive (lagging).`:''; last={kind:'pa',real:real,c:c,c2:c2,a:a,b:b,props:props,p:p,ans:dir(a[p[0]],b[p[0]]),  qtxt:`In this <b>parallel RLC circuit with a ${real?'real coil':'pure coil'}</b>, the <b>${vn(v,false)}</b> is <b>${up?'increased':'decreased'}</b> while everything else stays the same. What happens to the <b>${p[1]}</b>?`,  change:`${vn(v,false)} ${fmt(c[v],VU[v])} → ${fmt(c2[v],VU[v])}. The circuit is ${pNat(a)}, both before and after.`,why:tp+' '+PNOTE+cn,  hint:`Before the change: I<sub>R</sub> = ${fmt(a.IR,'A')}, ${real?ICs:'I<sub>L</sub>'} = ${fmt(a.IL,'A')}, I<sub>C</sub> = ${fmt(a.IC,'A')}; the circuit is <b>${pNat(a)}</b>. ${tp}`}; var ok=a.th>=8&&a.th<=80&&b.th>=8&&b.th<=80&&a.lag===b.lag;if(ok&&(d<1e-6||d>=0.03))return last}return last} function genParallel(){return genParA()} /* ---------- DIAGRAMS ---------- */ var TS=`fill='currentColor' stroke='none' font-size='12.5' font-family='system-ui,sans-serif'`; var SRC=`<circle cx='40' cy='100' r='18'/><path d='M30 100q5 -10 10 0t10 0'/>`; function lab(c){return `<text x='64' y='96'>${fmt(c.V,'V')}</text><text x='64' y='114'>${fmt(c.f,'Hz')}</text>`} function svgS(c){var real=c.Rc>0;if(!real)return `<svg viewBox='0 0 400 190' role='img' aria-label='Series RLC circuit with a pure coil'><g fill='none' stroke='currentColor' stroke-width='2' stroke-linejoin='round'><path d='M40 82V30H110M170 30H210M270 30H340V95M340 105V170H40V118'/><path d='M110 30l5 -8l10 16l10 -16l10 16l10 -16l10 16l5 -8'/><path d='M210 30a7.5 7.5 0 0 1 15 0a7.5 7.5 0 0 1 15 0a7.5 7.5 0 0 1 15 0a7.5 7.5 0 0 1 15 0'/><path d='M325 95H355M325 105H355' stroke-width='3'/>${SRC}</g><g ${TS}><text x='140' y='14' text-anchor='middle'>R = ${fmt(c.R,'Ω')}</text><text x='240' y='14' text-anchor='middle'>L = ${fmt(c.L,'H')}</text><text x='240' y='58' text-anchor='middle' font-size='11'>(pure coil)</text><text x='318' y='104' text-anchor='end'>C = ${fmt(c.C,'F')}</text>${lab(c)}</g></svg>`; return `<svg viewBox='0 0 400 190' role='img' aria-label='Series circuit with a resistor, a real coil and a capacitor'><g fill='none' s und'><path d='M40 82V30H350M40 118V170H350'/><path d='M115 30V70l-8 5l16 10l-16 10l16 10l-16 10l16 10l-8 5V170'/>${coil}<g${capDash}><path d='M350 30V95M350 105V170'/><path d='M335 95H365M335 105H365' stroke-width='3'/></g>${SRC}</g><g fill='currentColor'><circle cx='115' cy='30' r='3.5'/><circle cx='210' cy='30' r='3.5'/><circle cx='115' cy='170' r='3.5'/><circle cx='210' cy='170' r='3.5'/></g><g ${TS}><text x='128' y='104'>R = ${fmt(c.R,'Ω')}</text>${coilLab}<text x='345' y='126' text-anchor='end' font-size='11.5'>${cl}</text>${lab(c)}</g></svg>`} /* ---------- UI ---------- */ function st0(){return {c:0,t:0,s:0,q:null,done:false,choice:null}}var state={series:st0(),parallel:st0()};var LBL={series:'Series',parallel:'Parallel'}; function word(d){return d==='inc'?'increases':(d==='dec'?'decreases':'stays the same')}function arw(d){return d==='inc'?'▲':(d==='dec'?'▼':'—')} function newQ(){var s=state[mode];s.q=mode==='series'?genSeries():genParallel();s.done=false;s.choice=null;$('#rlcHint').hidden=true;$('#rlcHintB').textContent='Show hint'} function fb(s){var q=s.q,p=q.p,ok=s.choice===q.ans;var h=`<div class='verd ${ok?'ok':'no'}'>${ok?'✔ Correct!':'✘ Not quite.'} The ${p[1]} <u>${word(q.ans)}</u>: ${fmt(q.a[p[0]],p[2])} → ${fmt(q.b[p[0]],p[2])}</div>`; h+=`<p><b>Change made:</b> ${q.change}</p><p><b>Why:</b> ${q.why}</p><p><b>Key formula:</b> ${p[3]}</p>`;var rows='';q.props.forEach(function(r){var d=dir(q.a[r[0]],q.b[r[0]]);rows+=`<tr class='${r[0]===p[0]?'hl':''}'><td>${r[1].charAt(0).toUpperCase()+r[1].slice(1)}</td><td>${fmt(q.a[r[0]],r[2])}</td><td>${fmt(q.b[r[0]],r[2])}</td><td>${arw(d)}</td></tr>`}); h+=`<div class='tw'><table><thead><tr><th>Property</th><th>Before</th><th>After</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table></div>`;return h} function render(){var s=state[mode],q=s.q;root.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.m===mode?'true':'false')}); $('#rlcScore').textContent=`${LBL[mode]} score: ${s.c} / ${s.t}${s.t?' ('+Math.round(100*s.c/s.t)+'%)':''} · Streak: ${s.s}`; $('#rlcSvg').innerHTML=mode==='series'?svgS(q.c):svgP(q);$('#rlcQ').innerHTML=q.qtxt; root.querySelectorAll('.ab').forEach(function(b){b.classList.remove('right','wrong');b.disabled=s.done;if(s.done){if(b.dataset.a===q.ans)b.classList.add('right');else if(b.dataset.a===s.choice)b.classList.add('wrong')}}); $('#rlcFb').innerHTML=s.done?fb(s):'';$('#rlcHint').innerHTML=q.hint;$('#rlcRef').innerHTML='<ul>'+q.props.map(function(r){return '<li>'+r[3]+'</li>'}).concat((q.extra||[]).map(function(x){return '<li>'+x+'</li>'})).join('')+'</ul>'} root.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){mode=t.dataset.m;if(!state[mode].q)newQ();$('#rlcHint').hidden=true;$('#rlcHintB').textContent='Show hint';render()})}); root.querySelectorAll('.ab').forEach(function(b){b.addEventListener('click',function(){var s=state[mode];if(s.done)return;s.choice=b.dataset.a;s.done=true;s.t++;if(s.choice===s.q.ans){s.c++;s.s++}else{s.s=0}render()})}); $('#rlcNext').addEventListener('click',function(){newQ();render()});$('#rlcReset').addEventListener('click',function(){var s=state[mode];s.c=0;s.t=0;s.s=0;render()}); $('#rlcHintB').addEventListener('click',function(){var h=$('#rlcHint');h.hidden=!h.hidden;this.textContent=h.hidden?'Show hint':'Hide hint'});newQ();render()})(); </script></div>
